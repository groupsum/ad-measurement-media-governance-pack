  "decision": [
    "Treat IAB click measurement guidance as the authority for valid-click counting and click reporting controls.",
    "Distinguish clickthrough events from in-unit interactions and other engagement signals.",
    "Filter invalid or fraudulent clicks before reported click metrics are published."
  ],
  "conformance_targets": [
    "Valid click criteria",
    "Invalid and fraudulent click filtration",
    "Clickthrough versus in-unit interaction classification"
  ],
  "evidence_expectations": [
    "Click event fixtures",
    "Filtration logs",
    "Reported click metric exports"
  ]

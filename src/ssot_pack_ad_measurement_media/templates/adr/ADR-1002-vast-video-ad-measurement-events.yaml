  "decision": [
    "Treat VAST tracking events as the authoritative event vocabulary for video ad measurement where VAST is used.",
    "Record impression, quartile, completion, click, error, and verification-related events with stable identifiers and timestamps.",
    "Retain enough event ordering and correlation data to reconcile raw events with reported video ad metrics."

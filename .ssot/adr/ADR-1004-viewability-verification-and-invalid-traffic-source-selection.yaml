body: |-
  ## Context
  
  Ad measurement quality depends on whether impressions are measurable, viewable, verified, and filtered for invalid traffic before metrics are reported.
  
  ## Decision
  
  Open Measurement SDK / OMID is selected as the primary verification and viewability technical source. MRC and IAB measurement guidance are selected as quality-control sources for viewability classification, invalid traffic filtration, and auditability expectations.

body: |-
  ## Context
  
  IAB Tech Lab specifications provide the technical interfaces and object models that shape ad inventory, bid request, video ad serving, and verification measurement interoperability.
  
  ## Decision
  
  OpenRTB, AdCOM, VAST, and Open Measurement SDK / OMID are selected as canonical technical authority sources for this repository's ad/media measurement template set. Source curation must keep protocol/object-model targets distinct from measurement guideline targets because downstream implementers need different decisions and tests for payload conformance, event semantics, verification signals, and reporting.

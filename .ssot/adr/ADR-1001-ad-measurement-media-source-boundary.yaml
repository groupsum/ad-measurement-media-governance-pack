body: |-
  ## Context
  
  This repository curates authority sources for advertising and media measurement governance. The source set spans IAB Tech Lab technical specifications, IAB/MRC measurement guidelines, and measurement quality guidance used to define downstream conformance templates.
  
  ## Decision
  
  The pack authority boundary is limited to advertising and media measurement targets. Canonical sources include OpenRTB, AdCOM, VAST, Open Measurement SDK / OMID, IAB Click Measurement Guidelines, IAB Digital Video Ad Measurement Guidelines, and MRC measurement-quality standards relevant to viewability, invalid traffic, and auditability.
  
  The boundary excludes analytics platform implementation guides, vendor-specific conversion APIs, ecommerce semantics, consent transport, and customer data profile standards unless those sources are needed only as contextual inputs for ad/media measurement.

body: |-
  ## Context
  
  Downstream repositories need reusable governance templates that translate ad/media measurement standards into durable evidence expectations for audits, reporting, and reconciliation.
  
  ## Decision
  
  The repository will curate evidence-relevant targets from the selected ad/media measurement sources, including tracking events, measurement logs, verification signals, invalid-traffic filtration records, export totals, and audit reports.

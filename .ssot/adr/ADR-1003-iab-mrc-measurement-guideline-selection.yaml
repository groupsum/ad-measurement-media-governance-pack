body: |-
  ## Context
  
  IAB and MRC measurement guidelines define counting, validity, and audit expectations for advertising metrics such as clicks, impressions, video impressions, viewability, and invalid traffic treatment.
  
  ## Decision
  
  IAB Click Measurement Guidelines, IAB Digital Video Ad Measurement Guidelines, and applicable MRC measurement-quality standards are selected as canonical guideline sources for downstream measurement policy templates. These sources govern measurement validity and reporting expectations rather than protocol payload shape.

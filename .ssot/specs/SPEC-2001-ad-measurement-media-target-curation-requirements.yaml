body: |-
  ## Requirements
  
  This repository must curate advertising and media measurement targets only when they define ad inventory, ad serving, ad measurement events, viewability, verification, click validity, video impression counting, invalid traffic treatment, reporting, reconciliation, or audit evidence.
  
  Each curated target must record the authority owner, source title, source type, governed measurement capability, and version or publication date when available.
  
  The curated target set must include OpenRTB, AdCOM, VAST, Open Measurement SDK / OMID, IAB Click Measurement Guidelines, IAB Digital Video Ad Measurement Guidelines, and relevant MRC measurement-quality standards.
  
  ## Exclusions
  
  The curation surface excludes generic web analytics, ecommerce semantics, customer identity, consent transport, and vendor ad platform APIs unless used only as contextual references for an ad/media measurement target.

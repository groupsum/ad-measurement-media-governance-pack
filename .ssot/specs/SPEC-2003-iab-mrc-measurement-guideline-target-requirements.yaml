body: |-
  ## Requirements
  
  IAB and MRC measurement guideline targets must be curated as counting, validity, filtration, reporting, and auditability sources. Click measurement, video ad measurement, viewability, invalid traffic, and audit evidence targets must remain distinct because downstream repositories need separate policies and tests for each metric family.
  
  Guideline targets must identify whether they govern raw event capture, valid metric counting, invalid metric exclusion, reportable aggregates, or audit evidence.
  
  ## Evidence
  
  The repository must maintain enough target metadata to justify downstream templates for click validity, video impression counting, viewability classification, invalid traffic filtration, and reporting reconciliation.

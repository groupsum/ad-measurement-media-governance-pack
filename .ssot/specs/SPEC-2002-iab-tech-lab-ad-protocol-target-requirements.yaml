body: |-
  ## Requirements
  
  IAB Tech Lab protocol targets must be curated as separate authority surfaces. OpenRTB and AdCOM targets must be represented as inventory, bid request, object model, creative, context, device, user, and measurement field surfaces. VAST targets must be represented as video ad serving, tracking event, verification, error, click, and reporting surfaces. Open Measurement SDK / OMID targets must be represented as session, verification access, measurement registration, and viewability signal surfaces.
  
  Source records must not collapse protocol payload requirements into measurement-quality policy requirements.
  
  ## Evidence
  
  The repository must retain source references and template mappings that show which downstream ADR and SPEC templates are justified by each IAB Tech Lab protocol target.
